<!DOCTYPE html>

    <title>Document</title>
    <style>
        #main{
            width:100%;
            height:100%;
            display:flex;
            gap:40px;
            padding:40px;
        }

        #cards{
            flex:1;
            display:flex;
            flex-wrap:wrap;
            gap:20px;
            align-content:flex-start;
        }

        .card{
            width:250px;
            background:#333;
            color:white;
            border-radius:12px;
            padding:20px;
            text-align:center;
        }

        .card img{
            width:80px;
            height:80px;
            border-radius:50%;
            object-fit:cover;
        }

        .card h2{
            margin:12px 0 8px;
        }

        .card p{
            margin:5px 0;
        }
    </style>
</head>
